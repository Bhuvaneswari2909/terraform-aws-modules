
name: Tag Terraform Modules

on:
  push:
    branches:
      - main
    paths:
      - "modules/**"
  workflow_dispatch:
    inputs:
      module:
        description: "Terraform module name"
        required: true
        default: "all"
        type: string
permissions:
  contents: write

jobs:
  tag-modules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Detect changed modules and tag
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "No previous commit to compare"
            exit 0
          fi

          git diff --name-only "$BEFORE" "$AFTER" |
            awk -F/ '$1=="modules" && NF>=3 {print $2}' |
            sort -u > changed_modules.txt

          while IFS= read -r MODULE; do
            [[ -z "$MODULE" ]] && continue
            [[ -d "modules/$MODULE" ]] || continue

            echo "Processing module: $MODULE"

            PREFIX="${MODULE}/v"

            LATEST=$(git tag --list "${PREFIX}*" |
              grep -E "^${MODULE}/v[0-9]+\.[0-9]+\.[0-9]+$" |
              sort -V | tail -n 1 || true)

            if [[ -z "$LATEST" ]]; then
              NEW_VERSION="1.0.0"
            else
              VERSION="${LATEST#"$PREFIX"}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi

            NEW_TAG="${PREFIX}${NEW_VERSION}"

            echo "Creating tag: $NEW_TAG"

            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"

          done < changed_modules.txt

