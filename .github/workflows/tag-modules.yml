
name: Terraform Module Tagging

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      module:
        description: "Module folder name or all"
        required: true
        default: "all"
        type: string
      version_bump:
        description: "Version increment"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: terraform-module-tagging
  cancel-in-progress: false

jobs:
  tag-modules:
    name: Tag Terraform Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch tags
        run: git fetch --tags origin

      - name: Detect Terraform modules
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INPUT_MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail

          # Discover root-level Terraform module folders
          find . -mindepth 1 -maxdepth 1 -type d \
            ! -name ".git" \
            ! -name ".github" \
            -printf '%f\n' |
          while IFS= read -r DIR; do
            if find "$DIR" -maxdepth 1 \
              -name "*.tf" -type f | grep -q .; then
              echo "$DIR"
            fi
          done | sort -u > all_modules.txt

          echo "Discovered Terraform modules:"
          cat all_modules.txt

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then

            if [[ "$INPUT_MODULE" == "all" ]]; then
              cp all_modules.txt changed_modules.txt
            else
              if ! grep -Fxq "$INPUT_MODULE" all_modules.txt; then
                echo "ERROR: Module not found: $INPUT_MODULE"
                exit 1
              fi
              printf '%s\n' "$INPUT_MODULE" \
                > changed_modules.txt
            fi

          elif [[ -z "$BEFORE_SHA" ]] ||
               [[ "$BEFORE_SHA" =~ ^0+$ ]]; then

            echo "Initial push. Selecting all modules."
            cp all_modules.txt changed_modules.txt

          else
            # Find the modules changed in this push
            git diff --name-only \
              "$BEFORE_SHA" "$AFTER_SHA" |
              awk -F/ 'NF >= 2 {print $1}' |
              sort -u > modified_dirs.txt

            grep -Fxf all_modules.txt modified_dirs.txt \
              > changed_modules.txt || true
          fi

          echo "Modules to tag:"
          cat changed_modules.txt

      - name: Create and push module tags
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            VERSION_BUMP="patch"
          fi

          if [[ ! -s changed_modules.txt ]]; then
            echo "No Terraform module changes detected."
            exit 0
          fi

          while IFS= read -r MODULE; do
            [[ -z "$MODULE" ]] && continue

            echo "--------------------------------"
            echo "Processing module: $MODULE"

            PREFIX="${MODULE}/v"

            # Get highest semantic version for this module
            LATEST_VERSION=""

            while IFS= read -r TAG; do
              VERSION="${TAG#"$PREFIX"}"

              if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                if [[ -z "$LATEST_VERSION" ]] ||
                   [[ "$(printf '%s\n%s\n' \
                     "$LATEST_VERSION" "$VERSION" |
                     sort -V | tail -n 1)" == "$VERSION" ]]; then
                  LATEST_VERSION="$VERSION"
                fi
              fi
            done < <(git tag --list "${PREFIX}*")

            if [[ -z "$LATEST_VERSION" ]]; then
              NEW_VERSION="1.0.0"
            else
              IFS='.' read -r MAJOR MINOR PATCH \
                <<< "$LATEST_VERSION"

              case "$VERSION_BUMP" in
                major)
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                  ;;
                minor)
                  MINOR=$((MINOR + 1))
                  PATCH=0
                  ;;
                patch)
                  PATCH=$((PATCH + 1))
                  ;;
                *)
                  echo "Invalid version bump"
                  exit 1
                  ;;
              esac

              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi

            NEW_TAG="${PREFIX}${NEW_VERSION}"

            echo "Creating Git tag: $NEW_TAG"

            if git rev-parse -q --verify \
              "refs/tags/$NEW_TAG" >/dev/null; then
              echo "ERROR: Tag already exists: $NEW_TAG"
              exit 1
            fi

            git tag -a "$NEW_TAG" \
              -m "Release $MODULE version $NEW_VERSION"

            git push origin "refs/tags/$NEW_TAG"

            echo "Successfully pushed: $NEW_TAG"

          done < changed_modules.txt

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          echo "## Terraform Module Tagging" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "### Existing Git tags" \
            >> "$GITHUB_STEP_SUMMARY"

          git tag --list | sort -V \
            >> "$GITHUB_STEP_SUMMARY"
